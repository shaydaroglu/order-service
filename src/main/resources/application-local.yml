spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/order
    username: order_user
    password: order_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.sercan.catalog: DEBUG

catalog:
  service:
    url: http://localhost:8081/
